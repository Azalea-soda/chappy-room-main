name: Validate Chappy test branch

on:
  push:
    branches:
      - voice-stream-queue-v2

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and check inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", html, flags=re.IGNORECASE)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript was found in index.html")
          for number, script in enumerate(scripts, 1):
              Path(f"/tmp/chappy-script-{number}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(scripts)} inline script block(s).")
          PY
          for script in /tmp/chappy-script-*.js; do
            echo "Checking $script"
            node --check "$script"
          done
