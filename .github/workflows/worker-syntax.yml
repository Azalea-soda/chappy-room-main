name: Worker syntax check

on:
  push:
    branches:
      - memory-admin-v1
    paths:
      - "worker.js"
      - ".github/workflows/worker-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
