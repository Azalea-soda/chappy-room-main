<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>チャッピー記憶管理</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 14px 40px; background: #fff8ee; color: #554638; font-family: sans-serif; }
    main { width: min(760px, 100%); margin: 0 auto; }
    h1 { text-align: center; font-size: 1.55rem; }
    h2 { font-size: 1.15rem; margin: 22px 0 10px; }
    p { line-height: 1.65; }
    .panel { background: #fff; border: 1px solid #eadcc9; border-radius: 14px; padding: 16px; margin: 14px 0; }
    input, textarea, select, button { width: 100%; font: inherit; padding: 12px; border-radius: 9px; }
    input, textarea, select { border: 1px solid #cdbda9; background: #fff; color: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    button { border: 0; background: #d99545; color: white; font-weight: 700; cursor: pointer; margin-top: 9px; }
    button.secondary { background: #8d8174; }
    button.danger { background: #b84c43; }
    button:disabled { opacity: .55; cursor: wait; }
    label { display: block; font-weight: 700; margin: 12px 0 6px; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .tabs button { margin: 0; padding: 10px 5px; background: #e9dfd2; color: #554638; }
    .tabs button[aria-pressed="true"] { background: #d99545; color: white; }
    .record { border: 1px solid #eadcc9; border-radius: 11px; padding: 13px; margin: 10px 0; background: #fffdf9; }
    .record-layout { display: grid; grid-template-columns: minmax(0, 7fr) minmax(180px, 3fr); gap: 14px; align-items: start; }
    .record-main { min-width: 0; }
    .record-meta { color: #786b5d; font-size: .85rem; }
    .record-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 8px 0; }
    .record-content-wrap { position: relative; }
    .record-content.collapsed { max-height: calc(1.6em * 3); overflow: hidden; }
    .record-content-toggle {
      position: absolute; right: 0; bottom: 0; width: auto; height: 1.6em;
      margin: 0; padding: 0 3px 0 15px; border: 0; border-radius: 0;
      background: linear-gradient(to right, rgba(255,253,249,0), #fffdf9 35%);
      color: #8d8174; font-size: .9rem; line-height: 1.6; font-weight: 700;
    }
    .record-content-wrap.expanded .record-content-toggle {
      position: static; display: block; margin-left: auto; padding: 0 3px;
      background: transparent; height: auto;
    }
    .record-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .record-actions button, .record-actions select { width: 100%; min-width: 0; margin: 0; padding: 10px 6px; font-size: .9rem; }
    .record-actions select { border: 1px solid #cdbda9; background: #fff; color: inherit; border-radius: 9px; }
    .record-summary { background: #fffdf9; border: 1px solid #eadcc9; border-radius: 10px; padding: 10px 12px; margin: 12px 0; line-height: 1.8; }
    .password-row { display: flex; gap: 8px; align-items: stretch; }
    .password-row input { flex: 1; min-width: 0; }
    .password-row button { width: auto; min-width: 76px; margin: 0; padding: 8px 12px; }
    @media (max-width: 520px) {
      .record-layout { grid-template-columns: minmax(0, 1fr); }
      .record-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    #message { min-height: 1.5em; white-space: pre-wrap; }
    .muted { color: #786b5d; font-size: .9rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>🐱 チャッピーの記憶管理</h1>
  <p class="muted">管理者専用ページだよ。お母さんの端末登録とは別に、管理者パスワードで認証するよ。</p>

  <section id="loginPanel" class="panel">
    <h2>管理者ログイン</h2>
    <form id="loginForm">
      <label for="adminPassword">管理者パスワード</label>
      <div class="password-row">
        <input id="adminPassword" type="password" autocomplete="current-password" required>
        <button id="togglePasswordButton" class="secondary" type="button" aria-pressed="false">表示</button>
      </div>
      <button id="loginButton" type="submit">ログイン</button>
    </form>
  </section>

  <section id="manager" hidden>
    <div class="panel">
      <div class="tabs" role="group" aria-label="記憶の部屋">
        <button type="button" data-room="mother_memories" aria-pressed="true">M：お母さん</button>
        <button type="button" data-room="chappy_profile" aria-pressed="false">C：チャッピー</button>
        <button type="button" data-room="fixed_rules" aria-pressed="false">固定ルール</button>
      </div>
      <p class="muted">記憶の追加・修正・状態変更・削除ができるよ。固定ルールは自動記憶の対象にはならないよ。</p>
    </div>

    <section class="panel">
      <h2 id="formTitle">記憶を追加</h2>
      <form id="recordForm">
        <label for="category">分類</label>
        <input id="category" maxlength="100" required placeholder="例：好きなこと、思い出、気持ち">
        <label for="content">内容</label>
        <textarea id="content" maxlength="10000" required placeholder="記憶する内容"></textarea>
        <button id="saveButton" type="submit">追加する</button>
        <button id="cancelEditButton" class="secondary" type="button" hidden>編集をやめる</button>
      </form>
    </section>

    <section class="panel">
      <h2>保存されている記録</h2>
      <div id="recordSummary" class="record-summary" aria-live="polite"></div>
      <button id="refreshButton" class="secondary" type="button">一覧を更新</button>
      <div id="records"></div>
    </section>
    <button id="logoutButton" class="secondary" type="button">ログアウト</button>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  'use strict';
  // 本番D1への誤接続を防ぐため、テスト専用Workerが用意できるまで接続先は空にする。
  // 接続先を設定する際も、本番Worker URLは絶対に指定しない。
  const API_URL = 'https://chappy-memory-admin-test.nanami-moca.workers.dev';
  const TOKEN_KEY = 'chappy_admin_session';
  const loginPanel = document.getElementById('loginPanel');
  const manager = document.getElementById('manager');
  const loginForm = document.getElementById('loginForm');
  const passwordInput = document.getElementById('adminPassword');
  const message = document.getElementById('message');
  const recordForm = document.getElementById('recordForm');
  const categoryInput = document.getElementById('category');
  const contentInput = document.getElementById('content');
  const recordsEl = document.getElementById('records');
  const recordSummary = document.getElementById('recordSummary');
  const saveButton = document.getElementById('saveButton');
  const formTitle = document.getElementById('formTitle');
  const cancelEditButton = document.getElementById('cancelEditButton');
  let adminToken = sessionStorage.getItem(TOKEN_KEY) || '';
  let activeRoom = 'mother_memories';
  let editingId = null;
  let currentRecords = [];

  const roomNames = {
    mother_memories: 'M：お母さんの記憶',
    chappy_profile: 'C：チャッピーのプロフィール',
    fixed_rules: '固定ルール'
  };

  function setMessage(text) { message.textContent = text || ''; }

  document.getElementById('togglePasswordButton').addEventListener('click', (event) => {
    const button = event.currentTarget;
    const isVisible = passwordInput.type === 'text';
    passwordInput.type = isVisible ? 'password' : 'text';
    button.textContent = isVisible ? '表示' : '非表示';
    button.setAttribute('aria-pressed', String(!isVisible));
  });
  function showManager() {
    loginPanel.hidden = true;
    manager.hidden = false;
  }
  function showLogin() {
    adminToken = '';
    sessionStorage.removeItem(TOKEN_KEY);
    loginPanel.hidden = false;
    manager.hidden = true;
    recordsEl.replaceChildren();
    resetForm();
  }
  function resetForm() {
    editingId = null;
    recordForm.reset();
    formTitle.textContent = '記録を追加：' + roomNames[activeRoom];
    saveButton.textContent = '追加する';
    cancelEditButton.hidden = true;
  }
  async function api(path, body, token = adminToken) {
    if (!API_URL) throw new Error('安全確認中だよ。テスト専用Workerが接続されるまで、管理機能はまだ使えないよ。');
    const response = await fetch(API_URL + path, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify(body)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (response.status === 401) showLogin();
      throw new Error(data.error || '通信に失敗したよ（' + response.status + '）');
    }
    return data;
  }
  async function loadRecords() {
    setMessage('記録を読み込んでいるよ…');
    recordsEl.replaceChildren();
    const data = await api('/admin/records', { action: 'list', room: activeRoom });
    currentRecords = Array.isArray(data.records) ? data.records : [];
    renderRecords();
    setMessage(currentRecords.length + '件の記録を読み込んだよ。');
  }
  function makeButton(label, className, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    if (className) button.className = className;
    button.addEventListener('click', handler);
    return button;
  }
  function renderRecords() {
    recordsEl.replaceChildren();
    const counts = { total: currentRecords.length, active: 0, ended: 0, cancelled: 0 };
    for (const record of currentRecords) {
      if (record.status === '継続中') counts.active++;
      else if (record.status === '終了') counts.ended++;
      else if (record.status === '取り消し') counts.cancelled++;
    }
    recordSummary.textContent =
      '現在の記録数：' + counts.total + '件 ／ 継続中：' + counts.active +
      '件 ／ 終了：' + counts.ended + '件 ／ 取り消し：' + counts.cancelled + '件';
    if (!currentRecords.length) {
      const empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = 'まだ記録がないよ。';
      recordsEl.append(empty);
      return;
    }
    for (const record of currentRecords) {
      const card = document.createElement('article');
      card.className = 'record';
      const meta = document.createElement('div');
      meta.className = 'record-meta';
      meta.textContent = (record.id || '') + ' ／ ' + (record.category || '') + ' ／ ' + (record.status || '');
      const contentWrap = document.createElement('div');
      contentWrap.className = 'record-content-wrap';
      const body = document.createElement('div');
      body.className = 'record-content collapsed';
      body.textContent = record.content || '';
      const expandButton = document.createElement('button');
      expandButton.type = 'button';
      expandButton.className = 'record-content-toggle';
      expandButton.textContent = '▶';
      expandButton.setAttribute('aria-label', '記録の全文を表示');
      expandButton.setAttribute('aria-expanded', 'false');
      expandButton.hidden = true;
      expandButton.addEventListener('click', () => {
        const isExpanded = contentWrap.classList.toggle('expanded');
        body.classList.toggle('collapsed', !isExpanded);
        expandButton.textContent = isExpanded ? '▼' : '▶';
        expandButton.setAttribute('aria-label', isExpanded ? '記録を閉じる' : '記録の全文を表示');
        expandButton.setAttribute('aria-expanded', String(isExpanded));
      });
      contentWrap.append(body, expandButton);
      const mainContent = document.createElement('div');
      mainContent.className = 'record-main';
      mainContent.append(meta, contentWrap);

      const actions = document.createElement('div');
      actions.className = 'record-actions';
      actions.append(
        makeButton('修正する', 'secondary', () => beginEdit(record)),
        makeButton('追記する', 'secondary', () => appendRecord(record))
      );

      const statusSelect = document.createElement('select');
      statusSelect.setAttribute('aria-label', record.id + ' の状態');
      for (const status of ['継続中', '終了', '取り消し']) {
        const option = document.createElement('option');
        option.value = status;
        option.textContent = status;
        statusSelect.append(option);
      }
      statusSelect.value = ['継続中', '終了', '取り消し'].includes(record.status)
        ? record.status : '継続中';
      statusSelect.addEventListener('change', () => changeStatus(record, statusSelect));
      actions.append(
        statusSelect,
        makeButton('削除する', 'danger', () => deleteRecord(record))
      );

      const layout = document.createElement('div');
      layout.className = 'record-layout';
      layout.append(mainContent, actions);
      card.append(layout);
      recordsEl.append(card);
      if (body.scrollHeight > body.clientHeight + 1) {
        expandButton.hidden = false;
      } else {
        body.classList.remove('collapsed');
        expandButton.hidden = true;
      }
    }
  }
  function beginEdit(record) {
    editingId = record.id;
    categoryInput.value = record.category || '';
    contentInput.value = record.content || '';
    formTitle.textContent = '記録を修正：' + record.id;
    saveButton.textContent = '修正を保存';
    cancelEditButton.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  async function appendRecord(record) {
    const addition = window.prompt('この記録に追記する内容を入力してね');
    if (addition === null || !addition.trim()) return;
    try {
      await api('/admin/records', {
        action: 'append', room: activeRoom, id: record.id, content: addition.trim()
      });
      await loadRecords();
    } catch (error) { setMessage(error.message); }
  }
  async function changeStatus(record, statusSelect) {
    const next = statusSelect.value;
    if (!['継続中', '終了', '取り消し'].includes(next)) {
      statusSelect.value = record.status || '継続中';
      return;
    }
    if (!window.confirm(record.id + ' を「' + next + '」に変更する？')) {
      statusSelect.value = record.status || '継続中';
      return;
    }
    statusSelect.disabled = true;
    try {
      await api('/admin/records', { action: 'status', room: activeRoom, id: record.id, status: next });
      await loadRecords();
    } catch (error) {
      statusSelect.value = record.status || '継続中';
      setMessage(error.message);
    } finally {
      statusSelect.disabled = false;
    }
  }
  async function deleteRecord(record) {
    if (!window.confirm('「' + (record.content || '').slice(0, 70) + '」を完全に削除するよ。元に戻せないけど、本当にいい？')) return;
    try {
      await api('/admin/records', { action: 'delete', room: activeRoom, id: record.id });
      if (editingId === record.id) resetForm();
      await loadRecords();
    } catch (error) { setMessage(error.message); }
  }

  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = passwordInput.value;
    document.getElementById('loginButton').disabled = true;
    setMessage('認証中だよ…');
    try {
      const data = await api('/admin/login', { password }, '');
      if (!data.adminToken) throw new Error('認証トークンを受け取れなかったよ。');
      adminToken = data.adminToken;
      sessionStorage.setItem(TOKEN_KEY, adminToken);
      passwordInput.value = '';
      showManager();
      await loadRecords();
    } catch (error) {
      setMessage(error.message);
    } finally {
      document.getElementById('loginButton').disabled = false;
    }
  });

  recordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    saveButton.disabled = true;
    try {
      const action = editingId ? 'update' : 'create';
      await api('/admin/records', {
        action,
        room: activeRoom,
        id: editingId,
        category: categoryInput.value.trim(),
        content: contentInput.value.trim()
      });
      resetForm();
      await loadRecords();
    } catch (error) {
      setMessage(error.message);
    } finally {
      saveButton.disabled = false;
    }
  });

  cancelEditButton.addEventListener('click', resetForm);
  document.getElementById('refreshButton').addEventListener('click', () => loadRecords().catch(e => setMessage(e.message)));
  document.getElementById('logoutButton').addEventListener('click', async () => {
    let serverRevoked = !adminToken;
    let revokeError = '';
    try {
      if (adminToken) {
        await api('/admin/logout', {});
        serverRevoked = true;
      }
    } catch (error) {
      revokeError = error.message;
    } finally {
      // サーバー側の結果にかかわらず、この画面の認証情報は破棄する。
      showLogin();
      if (serverRevoked) {
        setMessage('ログアウトしたよ。');
      } else {
        setMessage('この画面からはログアウトしたよ。ただしサーバー側の無効化は確認できなかったよ。セッションはログインから最長6時間で期限切れになるよ。' + (revokeError ? '\n' + revokeError : ''));
      }
    }
  });
  document.querySelectorAll('[data-room]').forEach(button => {
    button.addEventListener('click', async () => {
      activeRoom = button.dataset.room;
      document.querySelectorAll('[data-room]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      resetForm();
      try { await loadRecords(); } catch (error) { setMessage(error.message); }
    });
  });

  if (adminToken) {
    showManager();
    loadRecords().catch(error => setMessage(error.message));
  }
})();
</script>
</body>
</html>
